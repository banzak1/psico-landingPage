<header class="header">
  <div class="container header-container">
    <div class="logo">
      <a href="#">Jessica Regina</a>
    </div>
    <nav class="nav" [class.nav-open]="isMenuOpen">
      <a href="#sobre" (click)="closeMenu()">Sobre Mim</a>
      <a href="#especialidades" (click)="closeMenu()">Especialidades</a>
      <a href="#como-funciona" (click)="closeMenu()">Como Funciona</a>
      <a href="#faq" (click)="closeMenu()">Dúvidas</a>
      
      <ng-container *ngIf="authService.userProfile$ | async as user; else loginTemplate">
        <a *ngIf="user.role === 'admin'" href="#painel-admin" class="admin-badge" (click)="closeMenu()">⚙️ Admin</a>
        <button (click)="logout()" class="btn-link">Sair</button>
      </ng-container>
      <ng-template #loginTemplate>
        <button (click)="login()" class="btn-link">Acesso Especialista</button>
      </ng-template>

    </nav>
    <a href="https://wa.me/5575982294244" target="_blank" class="btn btn-outline cta-header">Agendar Consulta</a>
    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
