<header class="header">
  <div class="container header-container">
    <div class="logo">
      <a href="#">Jessica Regina</a>
    </div>
    <nav class="nav" [class.nav-open]="isMenuOpen">
      <a href="#sobre" (click)="closeMenu()">Sobre Mim</a>
      <a href="#especialidades" (click)="closeMenu()">Especialidades</a>
      <a href="#como-funciona" (click)="closeMenu()">Como Funciona</a>
      <a href="#faq" (click)="closeMenu()">Dúvidas</a>

      <!-- Admin badge (só aparece para admins, depende do Firestore) -->
      <ng-container *ngIf="authService.userProfile$ | async as user">
        <a *ngIf="user.role === 'admin'" href="#painel-admin" class="admin-badge" (click)="closeMenu()">⚙️ Admin</a>
      </ng-container>

      <!-- Botão Auth no mobile (dentro do nav) -->
      <button
        *ngIf="(authService.isLoggedIn$ | async); else mobileLoginBtn"
        (click)="logout()"
        class="btn-auth btn-auth--logout mobile-auth-btn">
        Sair
      </button>
      <ng-template #mobileLoginBtn>
        <button
          (click)="login()"
          class="btn-auth btn-auth--login mobile-auth-btn">
          Entrar
        </button>
      </ng-template>
    </nav>

    <!-- Botão Auth no desktop (fora do nav) -->
    <div class="header-actions">
      <button
        *ngIf="(authService.isLoggedIn$ | async); else desktopLoginBtn"
        (click)="logout()"
        class="btn-auth btn-auth--logout desktop-auth-btn">
        Sair
      </button>
      <ng-template #desktopLoginBtn>
        <button
          (click)="login()"
          class="btn-auth btn-auth--login desktop-auth-btn">
          Entrar
        </button>
      </ng-template>
      <a href="https://wa.me/5575982294244" target="_blank" class="btn btn-outline cta-header">Agendar Consulta</a>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
